name: Clipping Digital UFSB/ACS

on:
  schedule:
    # 08h, 14h e 20h no horário de Brasília (UTC-3) => 11h, 17h, 23h UTC.
    # Ajuste conforme config.yaml -> monitoring.frequency_cron
    - cron: "0 11,17,23 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução"
        required: true
        default: "monitoramento"
        type: choice
        options:
          - monitoramento
          - backfill
          - smoke-test

jobs:
  clipping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar navegador do Playwright (Chromium)
        run: playwright install --with-deps chromium

      - name: Rodar smoke-test (valida integração antes de tocar em produção)
        run: python src/pipeline.py --modo smoke-test

      - name: Rodar pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python src/pipeline.py --modo "${{ github.event.inputs.modo || 'monitoramento' }}"
